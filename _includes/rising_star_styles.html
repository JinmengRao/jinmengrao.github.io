<!-- Styles for the Rising Star 2027 page. Inline on purpose: purgecss in CI strips classes not found in main.css sources. -->
<style>
  #rs-page { max-width: 900px; margin: 0 auto; color: var(--global-text-color); line-height: 1.65; }
  #rs-page a { color: var(--global-theme-color); }
  #rs-page a:hover { text-decoration: underline; }

  .rs-header { display: flex; gap: 1.75rem; align-items: center; padding: 0.5rem 0 1.5rem; border-bottom: 1px solid var(--global-divider-color); }
  .rs-photo { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; flex: 0 0 128px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .rs-kicker { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--global-text-color-light); }
  #rs-title { font-size: 2rem; font-weight: 500; margin: .2rem 0 .25rem; }
  .rs-role { margin: 0 0 .5rem; color: var(--global-text-color-light); }
  .rs-links-inline { margin: 0; font-size: .92rem; }
  .rs-links-inline a + a::before { content: "\00B7"; color: var(--global-text-color-light); margin: 0 .55rem; display: inline-block; text-decoration: none; }

  .rs-intro { margin: 1.25rem 0 0; color: var(--global-text-color-light); font-size: .95rem; }

  .rs-section { padding-top: 2rem; }
  .rs-h2 { font-size: 1.45rem; font-weight: 500; padding-bottom: .35rem; margin-bottom: 1rem; border-bottom: 2px solid var(--global-theme-color); display: flex; align-items: center; }
  .rs-num { display: inline-flex; align-items: center; justify-content: center; width: 1.7rem; height: 1.7rem; border-radius: 50%; margin-right: .6rem; font-size: .95rem; color: #fff; background: var(--global-theme-color); }
  .rs-h3 { font-size: 1.08rem; font-weight: 600; margin: 1.3rem 0 .5rem; }
  #rs-page ul { padding-left: 1.2rem; }
  #rs-page li { margin-bottom: .4rem; }

  .rs-facts { width: 100%; border-collapse: collapse; font-size: .95rem; border: none; }
  #rs-page table th, #rs-page table td { border-left: none !important; border-right: none !important; background: transparent; }
  .rs-facts th, .rs-facts td { border: none !important; vertical-align: top !important; }
  .rs-facts th { width: 11rem; text-align: left; vertical-align: top; font-weight: 600; padding: .5rem 1rem .5rem 0; color: var(--global-text-color-light); white-space: nowrap; }
  .rs-facts td { padding: .5rem 0; }
  .rs-facts tr + tr th, .rs-facts tr + tr td { border-top: 1px solid var(--global-divider-color) !important; }

  .rs-item { display: grid; grid-template-columns: 170px 1fr; gap: 1.25rem; padding: 1rem 0; }
  .rs-item + .rs-item { border-top: 1px solid var(--global-divider-color); }
  .rs-item h3 { font-size: 1.08rem; font-weight: 600; margin: 0 0 .45rem; }
  .rs-item ul { margin-bottom: 0; font-size: .95rem; }
  .rs-thumb { width: 170px; height: 125px; object-fit: contain; background: #fff; border: 1px solid var(--global-divider-color); border-radius: 6px; }

  .rs-plain { list-style: none; padding-left: 0 !important; }
  .rs-plain li { display: grid; grid-template-columns: 6.5rem 1fr; gap: .75rem; padding: .35rem 0; margin: 0 !important; border-bottom: 1px solid var(--global-divider-color); }
  .rs-year { font-weight: 600; color: var(--global-theme-color); }

  .rs-table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  .rs-table th { text-align: left; font-weight: 600; padding: .45rem .6rem .45rem 0; border-bottom: 2px solid var(--global-divider-color); }
  .rs-table td { padding: .45rem .6rem .45rem 0; border-bottom: 1px solid var(--global-divider-color); vertical-align: top; }
  .rs-table td:last-child { white-space: nowrap; }
  #rs-industry-citations td:last-child { white-space: normal; width: 24%; color: var(--global-text-color-light); }
  #rs-industry-citations td:first-child { white-space: nowrap; font-weight: 600; }
  .rs-compact { margin: 0; padding-left: 1rem !important; }
  .rs-compact li { margin-bottom: .3rem !important; }
  .rs-note { font-size: .88rem; color: var(--global-text-color-light); margin-top: .5rem; }
  #rs-uptake-table td:first-child { white-space: nowrap; font-weight: 600; width: 9.5rem; }
  #rs-uptake-table td:last-child { white-space: normal; width: 18%; color: var(--global-text-color-light); }
  .rs-map { margin: .75rem 0 1.25rem; padding: .75rem; border: 1px solid var(--global-divider-color); border-radius: 8px; background: #fbfcfd; }
  .rs-map svg { display: block; width: 100%; height: auto; }
  .rs-map figcaption { font-size: .84rem; color: #5f6670; margin-top: .5rem; line-height: 1.5; }

  .rs-linklist { columns: 2; column-gap: 2rem; }
  .rs-closing { margin: 2.5rem 0 1rem; padding-top: 1rem; border-top: 1px solid var(--global-divider-color); color: var(--global-text-color-light); font-size: .95rem; }

  @media (max-width: 640px) {
    .rs-header { flex-direction: column; text-align: center; }
    .rs-item { grid-template-columns: 1fr; }
    .rs-thumb { width: 100%; height: 180px; }
    .rs-facts th { white-space: normal; width: 8rem; }
    .rs-linklist { columns: 1; }
    .rs-plain li { grid-template-columns: 1fr; gap: 0; }
  }
</style>
